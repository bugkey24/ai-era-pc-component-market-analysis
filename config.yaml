project:
  name: "AI-Driven Market Analysis"
  version: "1.0"
  environment: "google-colab"

scraping:
  categories:
    - gpu
    - ram
    - ssd
  max_pages: 8
  delay: 2.0
  retry_count: 3
  timeout: 10
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
  robots:
    enabled: true          # every fetch is robots-checked before requesting
    fail_open: false       # unreachable robots.txt -> block, never guess
    snapshot_dir: "docs/compliance/robots"
  platforms:
    - name: tokopedia
      enabled: true
      method: static
      base_url: "https://www.tokopedia.com"   # search uses /find/{cat}?page=N (robots-allowed)
      reviews_enabled: true                    # robots explicitly allows /*/review
      review_max_pages: 4                      # pages of reviews per product
      # Bare category words ("gpu") return accessories/books — search
      # chip-level keywords instead; breadcrumb filter removes the rest
      search_keywords:
        gpu: rtx
        ram: ddr5
        ssd: nvme
    - name: shopee
      enabled: true
      method: dynamic
      base_url: "https://shopee.co.id"
      reviews_enabled: true                    # ungoverned (URL fragments) — anti-bot risk
    - name: blibli
      enabled: true
      method: static
      base_url: "https://www.blibli.com"       # discovery via /c/ category pages, NOT /search (robots-disallowed)
      reviews_enabled: false                   # robots disallows /p/*/pr* — reviews are blocked

# Data quality thresholds — pipeline logs warnings when not met
data_requirements:
  min_products_per_category: 50
  min_total_products: 150
  min_reviews: 50
  min_reviews_with_negative: 10    # at least N negative/neutral reviews for sentiment training
  min_sentiment_accuracy: 0.75     # target: >75% held-out accuracy

preprocessing:
  handle_missing: "drop"
  outlier_threshold: 3.0
  normalize_ratings: true

sentiment:
  language: "indonesian"
  model: "LinearSVC"
  test_size: 0.2
  random_state: 42
  max_features: 5000

dss:
  criteria:
    - "price"
    - "performance"
    - "rating"
    - "seller_reliability"
    - "sentiment"
    - "future_value"
  criteria_types:
    - "cost"
    - "benefit"
    - "benefit"
    - "benefit"
    - "benefit"
    - "benefit"
  pairwise_matrix:
    - [1, 1/3, 3, 5, 5, 3]
    - [3, 1, 5, 7, 7, 5]
    - [1/3, 1/5, 1, 3, 3, 1/3]
    - [1/5, 1/7, 1/3, 1, 1, 1/5]
    - [1/5, 1/7, 1/3, 1, 1, 1/5]
    - [1/3, 1/5, 3, 5, 5, 1]

visualization:
  style: "darkgrid"  # seaborn style; legacy "seaborn-v0_8-*" names auto-resolved
  palette: "viridis"
  figsize: [12, 8]
  dpi: 150

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/pipeline.log"
